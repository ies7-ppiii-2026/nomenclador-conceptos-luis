[project]
name = "nomenclador-conceptos-luis"
version = "0.1.0"
description = "Proyecto para mapear codigos y conceptos de distintos sistemas."
requires-python = ">=3.12"
dependencies = [
    "datasets",
    "ipykernel",
    "jupyter-collaboration>=4.4.0",
    "jupyterlab",
    "jupytext",
    "matplotlib",
    "nbclassic>=1.3.3",
    "pandas",
    "scikit-learn",
    "seaborn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nomenclador_conceptos_luis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
